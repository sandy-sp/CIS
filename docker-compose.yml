services:
  app:
    image: b_s-app
    build: .
    environment:
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - APP_DEFAULT_LLM_BACKEND=ollama
      - APP_DEFAULT_EMBEDDING_BACKEND=ollama
      - APP_DEFAULT_OLLAMA_LLM_MODEL=llama3.2:3b
      - APP_DEFAULT_OLLAMA_EMBEDDING_MODEL=nomic-embed-text
    ports:
      - "8501:8501"
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    stop_grace_period: 15s

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ollama-init:
    image: b_s-app
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_BOOTSTRAP_MODELS=nomic-embed-text,llama3.2:3b
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["python", "scripts/bootstrap_ollama_models.py"]

volumes:
  qdrant_storage:
  ollama_data:
